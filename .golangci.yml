version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - exhaustruct
    - forcetypeassert
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilnil
    - promlinter
    - revive
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
  settings:
    # These checkers report on code already in the tree. goconst is
    # omitted from the enable list for the same reason.
    testifylint:
      disable:
        - bool-compare
        - empty
        - encoded-compare
        - error-is-as
        - expected-actual
        - float-compare
        - formatter
        - len
    staticcheck:
      checks:
        - all
        - -QF*
        - -S1028
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    gosec:
      excludes:
        - G115
        - G602
        - G703
      config:
        G101:
          entropy_threshold: "80.0"
          ignore_entropy: false
          pattern: (?i)passwd|pass|password|pwd|secret|private_key|token|pw|apiKey|bearer|cred|mneumonic|seed|seedphrase|entropy
          per_char_threshold: "3.0"
          truncate: "32"
    revive:
      rules:
        - name: var-naming
          arguments:
            - - ID
              - RPC
              - IDS
              - JSON
            - []
            - - upperCaseConst: true
          severity: warning
          disabled: false
          exclude:
            - ""
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1024: cutset contains duplicate characters'
      - linters:
          - staticcheck
        text: 'SA9004: only the first constant in this group has an explicit type'
      - linters:
          - staticcheck
        text: 'ST1003:'
      - linters:
          - staticcheck
        text: 'ST1005:'
      - linters:
          - staticcheck
        text: 'SA1019: "github.com/cosmos/ibc-go/v8/modules/core/02-client/types" is deprecated`'
      - linters:
          - staticcheck
        text: 'SA1019: \(cosmossdk.io/x/upgrade/types.Plan\)'
      - linters:
          - forcetypeassert
        text: 'right hand must be only type assertion'
      - linters:
          - revive
        path: _test\.go
        text: 'var-naming: don''t use underscores in Go names;'
      - linters:
          - gosec
        path: _test\.go
        text: 'G404: Use of weak random number generator'
    paths:
      - .*\.pb\.go
      - .*\.pb\.gw\.go
      - .*\.pulsar\.go
      - .*_mocks\.go
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go
      - .*\.pb\.gw\.go
      - .*\.pulsar\.go
      - .*_mocks\.go
      - third_party$
      - builtin$
      - examples$
