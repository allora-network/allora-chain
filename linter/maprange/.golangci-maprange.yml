version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - maprange
  settings:
    custom:
      maprange:
        path: bin/maprange.so
        description: Detects range loops over maps
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*\.pb\.go
      - .*\.pb\.gw\.go
      - .*\.pulsar\.go
      - .*_mocks\.go
      - third_party$
      - builtin$
      - examples$
      # A directory whose name starts with a dot.
      - '(^|/)\.[^/]+/'
issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - '(^|/)\.[^/]+/'
