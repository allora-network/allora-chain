name: golangci-lint
on:
  push:
    branches:
      - main
      - dev
      - release-*
  pull_request:

permissions:
  contents: read
  # Optional: allow write access to checks to allow the action to annotate code in the PR.
  checks: write

# Shai-Hulud defense: pin module integrity for every `go` invocation in this
# workflow. Mirrors the GOPROXY / GOSUMDB / GOFLAGS env exported by the
# reusable hardened-install workflow in go-hardened.yml. CGO_ENABLED=0 matches
# the release path (.goreleaser.yaml sets CGO_ENABLED=0 per-build); linters
# do not link C and no source in this repo does `import "C"`. go-hardened.yml
# is now aligned to cgo_enabled='0'; revisit all four CGO_ENABLED values
# together if a CGO-linking dep is reintroduced (ENGN-8441 tracks the broader
# wasmvm question).
env:
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "0"

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.5
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=10m

  custom-linters:
    name: custom-linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned rather than `stable`: the custom analyzers link
          # golang.org/x/tools, whose go/packages loader only understands
          # export data up to the Go release it shipped with. A floating
          # `stable` silently outran the pinned x/tools and broke package
          # loading with an "imported without types" internal error.
          # Keep in step with the `lint` job above and go.mod's toolchain.
          go-version: 1.23.5
      - name: check-defer-close
        run: go run ./linter/check-defer-close .
        timeout-minutes: 10
      - name: check-fuzz-transitions
        run: go run ./linter/fuzz-transitions
        timeout-minutes: 10
      - name: check-log-sprintf
        run: go run ./linter/log-sprintf ./...
        timeout-minutes: 10
      - name: check-duplicate-routes
        run: make duplicate-routes
        timeout-minutes: 10
