name: golangci-lint
on:
  push:
    branches:
      - main
      - dev
      - release-*
  pull_request:

permissions:
  contents: read
  # Optional: allow write access to checks to allow the action to annotate code in the PR.
  checks: write

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Build the linter with the Go from setup-go so its gofmt
          # matches this pin.
          install-mode: goinstall
          args: --timeout=10m

  custom-linters:
    name: custom-linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Not `stable`. The custom analyzers link golang.org/x/tools,
          # whose go/packages loader only understands export data up to
          # the Go release it shipped with. A floating major outruns that
          # loader. Pinned to the toolchain patch in go.mod.
          go-version: 1.27.3
      - name: check-defer-close
        run: go run ./linter/check-defer-close .
        timeout-minutes: 10
      - name: check-fuzz-transitions
        run: go run ./linter/fuzz-transitions
        timeout-minutes: 10
      - name: check-log-sprintf
        run: go run ./linter/log-sprintf ./...
        timeout-minutes: 10
      - name: check-duplicate-routes
        run: make duplicate-routes
        timeout-minutes: 10
