name: Run Upgrade Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/upgrades.go'
      - 'app/upgrades/**'
      - 'x/*/module/module.go'
      - 'x/*/migrations/**'
      - 'Dockerfile.upgrade'
      - 'test/local_testnet_l1.sh'
      - 'test/generate_genesis.sh'
      - 'test/validator.tmpl'
      - 'test/compose_l1_header.yaml'
      - 'test/integration/integration_test.go'
      - 'test/integration/upgrade_test.go'
      - 'test/integration/upgrade_scenarios_test.go'
      - 'test/integration/upgrade_populated_state_test.go'
      - 'test/fuzz/invariants.patch'
      - '.github/workflows/upgrade_test.yml'

permissions:
  contents: read

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Each ceiling selects a different migration outcome: a backfill from the live
    # value, the repair of a zero ceiling, and a floor clamped to a low ceiling.
    strategy:
      fail-fast: false
      matrix:
        seed-max-top-inferers: ["17", "0", "3"]

    steps:
    # Dockerfile.upgrade builds the baseline binary from a tag, so the build context needs the tags.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: actions/setup-go@v5
      with:
        go-version: 1.22.x

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true
        docker-images: true
        tools-cache: false

    # Dockerfile.upgrade builds the upgrade binary from the build context, so the patch
    # makes that binary run the emissions invariants in every end blocker.
    - name: Apply emissions invariants patch
      run: git apply ./test/fuzz/invariants.patch

    - name: Run allora l1 chain on the baseline binary
      run: DO_UPGRADE=true bash ./test/local_testnet_l1.sh

    - name: Require the invariants in the installed upgrade binary
      shell: bash
      run: |
        for node in validator0 validator1 validator2; do
          binary="test/localnet/$node/cosmovisor/upgrades/v0.18.0/bin/allorad"
          grep -aq 'Invariants broken' "$binary" || { echo "$binary lacks the invariants patch"; exit 1; }
        done

    # go test reports success when the suite skips or -run matches nothing, so the
    # job also requires the suite's own PASS line.
    - name: Upgrade test
      shell: bash
      env:
        UPGRADE: "true"
        UPGRADE_TARGET: v0.18.0
        RPC_MODE: SingleRpc
        RPC_URLS: http://localhost:26657
        UPGRADE_SEED_MAX_TOP_INFERERS: ${{ matrix.seed-max-top-inferers }}
      run: |
        go test -count=1 -timeout 60m -run '^TestUpgradeTestSuite$' -v ./test/integration | tee "$RUNNER_TEMP/upgrade-test.out"
        grep -q '^--- PASS: TestUpgradeTestSuite' "$RUNNER_TEMP/upgrade-test.out"

    # The seed leaves one refused-reactivation topic in the active set, and the migration
    # reports removing it. An invariant failure in any block halts the chain and fails above.
    - name: Require the migration to reconcile the seeded topic
      shell: bash
      run: |
        for node in validator0 validator1 validator2; do
          line=$(docker logs "$node" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -a 'topic activity state reconciled')
          echo "$node: $line"
          grep -q 'removedActiveTopics=1' <<< "$line"
        done

    # The diagnostic steps below never affect the job result.
    - name: Report validator state
      if: failure() || cancelled()
      continue-on-error: true
      timeout-minutes: 1
      shell: bash
      run: |
        set +e
        # Prints "unreachable" when the node gives no JSON and "absent" when the
        # field is missing, which is how an RPC error response looks.
        rpc_field() {
          local value
          value=$(curl -fsS --connect-timeout 2 --max-time 5 "http://localhost:$1/$2" | jq -r "$3 // \"absent\"")
          echo "${value:-unreachable}"
        }
        for i in 0 1 2; do
          port=$((26657 + i))
          echo "validator$i port=$port" \
            "status.latest_block_height=$(rpc_field "$port" status .result.sync_info.latest_block_height)" \
            "abci_info.last_block_height=$(rpc_field "$port" abci_info .result.response.last_block_height)" \
            "abci_info.version=$(rpc_field "$port" abci_info .result.response.version)"
        done
        docker ps -a
        exit 0

    # Logs are written outside the workspace so the upload cannot reach test/localnet,
    # which holds keyrings.
    - name: Capture validator logs
      if: failure() || cancelled()
      continue-on-error: true
      timeout-minutes: 2
      shell: bash
      run: |
        set +e
        log_dir="$RUNNER_TEMP/validator-logs"
        mkdir -p "$log_dir"
        for node in validator0 validator1 validator2; do
          echo "=== $node ==="
          if ! docker inspect "$node" > /dev/null; then
            echo "no logs captured"
            continue
          fi
          log_file="$log_dir/$node.log"
          docker logs -t "$node" > "$log_file" 2>&1 || echo "docker logs failed, $log_file may be partial"
          # -a keeps grep printing matched lines when a log contains binary bytes.
          grep -aE 'Invariants broken|panic|CONSENSUS FAILURE' "$log_file"
          case $? in
            0) ;;
            1) echo "no lines match Invariants broken, panic, or CONSENSUS FAILURE" ;;
            *) echo "could not scan $log_file" ;;
          esac
        done
        exit 0

    - name: Upload validator logs
      if: failure() || cancelled()
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/upload-artifact@v7
      with:
        name: validator-logs-${{ matrix.seed-max-top-inferers }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/validator-logs/*.log
        if-no-files-found: warn
        retention-days: 14
