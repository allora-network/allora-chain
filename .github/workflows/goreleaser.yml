name: goreleaser

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write

# Shai-Hulud defense: pin module integrity for every `go` invocation in this
# workflow (goreleaser shells out to `go build`). Mirrors the env exported by
# the reusable hardened-install workflow in go-hardened.yml. CGO_ENABLED=1
# here is effectively a no-op for the release build itself: .goreleaser.yaml
# sets CGO_ENABLED=0 per-build (netgo + pebbledb + ledger tags), and the
# per-build env wins over the workflow-level env. Keeping it at "1" keeps a
# single Shai-Hulud env block reusable across CI workflows; if/when the
# goreleaser config flips to CGO=1, this line already matches.
env:
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "1"

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unnecessary directories to free up space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.2
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
