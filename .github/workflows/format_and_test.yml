name: Run Format, Unit Tests, and Integration Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  gofmt:
    name: "Go Format Check"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check code formatting using gofmt
      uses: Jerome1337/gofmt-action@v1.0.5
      with:
          gofmt-path: '.'
          gofmt-flags: '-l -d'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: 1.22.x

    - name: Test
      uses: robherley/go-test-action@v1.1.0
      with:
        omit: |
          untested
          successful
          pie

  integration-test:
    runs-on: ubuntu-latest
    # Covers setup, both chain starts, both suite timeouts and the diagnostics caps.
    timeout-minutes: 60
    env:
      INTEGRATION: "TRUE"
      RPC_MODE: RoundRobin
      RPC_URLS: http://localhost:26657,http://localhost:26658,http://localhost:26659

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: 1.22.x

    - name: Disk usage (before)
      shell: bash
      run: |
        df -h
        echo "Workspace: $GITHUB_WORKSPACE"

    # Clean FIRST (before pulling/building/running chain)
    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true
        docker-images: true
        tools-cache: false

    - name: Disk usage (after reclaim)
      shell: bash
      run: |
        df -h
        docker system df || true

    - name: Apply Invariants Patch
      run: git apply ./test/fuzz/invariants.patch

    - name: Run allora l1 chain
      id: first_chain
      run: bash ./test/local_testnet_l1.sh

    - name: Integration test on the first chain
      run: /usr/bin/go test -count=1 -timeout 20m -run '^TestExternalTestSuite$' github.com/allora-network/allora-chain/test/integration -v

    # The diagnostic steps below never affect the job result. This one runs before the
    # next step removes the first chain's containers. Logs are written outside the
    # workspace so the upload cannot reach test/localnet, which holds keyrings.
    - name: Keep the first chain's state and logs
      if: always()
      continue-on-error: true
      timeout-minutes: 3
      run: bash ./test/collect_validator_diagnostics.sh "$RUNNER_TEMP/validator-logs/first-chain"

    # Runs after a first-suite failure too; that failure still fails the job.
    - name: Replace the first chain with a fresh one
      id: second_chain
      if: ${{ !cancelled() && steps.first_chain.outcome == 'success' }}
      env:
        LOCALNET_RESET: "true"
        LOCALNET_REUSE_IMAGE: "true"
      run: bash ./test/local_testnet_l1.sh

    - name: Integration test on the fresh chain
      if: ${{ !cancelled() && steps.second_chain.outcome == 'success' }}
      run: /usr/bin/go test -count=1 -timeout 15m -run '^TestExternalMultiTestSuite$' github.com/allora-network/allora-chain/test/integration -v

    - name: Keep the fresh chain's state and logs
      if: ${{ (failure() || cancelled()) && steps.second_chain.outcome != 'skipped' }}
      continue-on-error: true
      timeout-minutes: 3
      run: bash ./test/collect_validator_diagnostics.sh "$RUNNER_TEMP/validator-logs/fresh-chain"

    - name: Upload validator logs
      if: failure() || cancelled()
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/upload-artifact@v7
      with:
        name: validator-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/validator-logs
        if-no-files-found: warn
        retention-days: 14
