version: v1
deps:
  - buf.build/cosmos/cosmos-sdk # pin the Cosmos SDK version
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
lint:
  use:
    - DEFAULT
    - COMMENTS
  except:
    - COMMENT_ENUM_VALUE
    - COMMENT_ENUM
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
  allow_comment_ignores: false

breaking:
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
