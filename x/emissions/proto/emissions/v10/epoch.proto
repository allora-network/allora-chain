syntax = "proto3";
package emissions.v10;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/allora-network/allora-chain/x/emissions/types";

message Epoch {
  // The epoch identifier, aka nonce. Uniqueness is only guaranteed per topic.
  uint64 nonce = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "NonceV2"
  ];

  // The topic this epoch belongs to
  uint64 topic_id = 2;

  // The epoch current state in its lifecycle
  EpochState state = 3;

  // The worker submission window
  Window worker_submission_window = 4;

  // The reputer submission window
  Window reputer_submission_window = 5;

  // The topic's epsilon at the time the epoch was created
  string epsilon = 6 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];

  // Block height at StartNewEpoch. Transitional key into the legacy
  // BlockHeight-keyed submission/inference/reward data plane (LegacyNonce).
  // Canonical epoch id remains nonce (NonceV2).
  int64 start_block_height = 7;

  // Topic timing copied when the epoch is created. Close heights use these
  // values so a later topic update does not move this epoch.
  int64 topic_worker_submission_window = 8;
  int64 topic_ground_truth_lag = 9;
  int64 topic_epoch_length = 10;
}

enum EpochState {
  INIT = 0;
  WORKER_SUBMISSION = 1;
  WAITING_GROUND_TRUTH = 2;
  REPUTER_SUBMISSION = 3;
  PENDING_COMPLETION = 4;
  COMPLETED = 5;
  CANCELLED = 6;
}

message Window {
  // The window opening time, in unix timestamp
  google.protobuf.Timestamp open_at = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];

  // The window closing time, in unix timestamp
  google.protobuf.Timestamp close_at = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
}
