syntax = "proto3";
package emissions.v10;

import "emissions/v10/inference.proto";
import "emissions/v3/nonce.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/allora-network/allora-chain/x/emissions/types";

message TimestampedValue {
  option (gogoproto.equal) = true;

  int64 block_height = 1; // height at which value calculated or received
  string value = 2 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
}

message ForecastElement {
  option (gogoproto.equal) = true;

  string inferer = 1;
  string value = 2 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
}

message Forecast {
  option (gogoproto.equal) = true;
  uint64 topic_id = 1;
  int64 block_height = 2;
  string forecaster = 3;
  repeated ForecastElement forecast_elements = 4;
  bytes extra_data = 5;
}

message Forecasts {
  repeated Forecast forecasts = 1;
}

message InferenceForecastBundle {
  option (gogoproto.equal) = true;
  Inference inference = 1;
  Forecast forecast = 2;
}

message WorkerDataBundle {
  reserved 5, 6;
  option (gogoproto.equal) = true;
  string worker = 1;
  emissions.v3.Nonce nonce = 2;
  uint64 topic_id = 3;
  InferenceForecastBundle inference_forecasts_bundle = 4;
}

message WorkerDataBundles {
  repeated WorkerDataBundle worker_data_bundles = 1;
}
