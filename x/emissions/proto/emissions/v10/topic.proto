syntax = "proto3";
package emissions.v10;

import "emissions/v3/nonce.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/allora-network/allora-chain/x/emissions/types";

message Topic {
  reserved 4, 6, 7, 11;
  reserved "loss_logic", "inference_logic", "inference_method", "default_arg";

  uint64 id = 1;
  string creator = 2;
  string metadata = 3;
  string loss_method = 5;
  int64 epoch_last_ended = 8;
  int64 epoch_length = 9;
  int64 ground_truth_lag = 10;
  string p_norm = 12 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string alpha_regret = 13 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  bool allow_negative = 14;
  string epsilon = 15 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string initial_regret = 16 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  int64 worker_submission_window = 17;
  // alpha parameter to weight previous score EMA importance in
  // filtering the active set of inferers, forecasters, and reputers
  string merit_sortition_alpha = 18 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string active_inferer_quantile = 19 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string active_forecaster_quantile = 20 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string active_reputer_quantile = 21 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string c_norm = 22 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];

  TopicType topic_type = 23;
  TopicOutputArity output_arity = 24;
  bool require_unity = 25;
  string unity_tolerance = 26 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  // Per-topic cap on the number of labels a single worker may submit in one payload.
  uint64 max_labels_per_submission = 27;
  // Optional per-topic allowlist of canonicalized label names. When empty, the
  // topic is unrestricted; when non-empty, submitted labels must match (after
  // canonicalization) an entry in this list. Stored in canonical form.
  repeated string label_whitelist = 28;
  // Default value used for missing label slots in dense MULTI inference
  // vectors. Submitted labels equal to this value are treated as absent for
  // temporary and final epoch label registry inclusion.
  string label_default_value = 29 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  // When false (the default), label names are lowercased during canonicalization
  // so that "Cat", "CAT" and "cat" all collapse to "cat". When true, casing is
  // preserved and labels that differ only in case are treated as distinct.
  // This field is immutable after topic creation because flipping it would
  // change the canonical form of every already-persisted label (whitelist
  // entries and epoch registry names).
  bool label_case_sensitive = 30;
  // Per-topic cap on inferers admitted to the active set, enforced at
  // worker-payload insert: an inferer is admitted while the set is below the
  // cap, otherwise it must out-score the lowest member. Writes through
  // CreateNewTopic/UpdateTopic store a concrete value (a requested 0 resolves to
  // the global max_top_inferers_to_reward), and migration backfills legacy
  // topics; a genesis-supplied 0 is stored as-is and resolves at admission.
  uint64 max_top_inferers_to_reward = 31;
}

enum TopicType {
  TOPIC_TYPE_UNSPECIFIED = 0;
  TOPIC_TYPE_REGRESSION = 1;
  TOPIC_TYPE_CLASSIFICATION = 2;
}

enum TopicOutputArity {
  TOPIC_OUTPUT_ARITY_UNSPECIFIED = 0;
  TOPIC_OUTPUT_ARITY_SINGLE = 1;
  TOPIC_OUTPUT_ARITY_MULTI = 2;
}

message TopicList {
  repeated Topic topics = 1;
}

message TimestampedActorNonce {
  reserved 2;
  reserved "actor";

  option (gogoproto.equal) = true;

  int64 block_height = 1; // height at which value calculated or received
  emissions.v3.Nonce nonce = 3;
}

message TopicIds {
  option (gogoproto.equal) = true;
  repeated uint64 topic_ids = 1;
}

message TopicIdWeightPair {
  uint64 topic_id = 1;
  string weight = 2 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
}

message TopicLabel {
  uint32 id = 1;
  string name = 2;
}

message EpochLabelRegistry {
  uint64 topic_id = 1;
  uint64 epoch_id = 2;
  repeated TopicLabel labels = 3;
}
