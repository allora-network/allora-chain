syntax = "proto3";
package emissions.v10;

import "gogoproto/gogo.proto";

option go_package = "github.com/allora-network/allora-chain/x/emissions/types";

message LabeledValue {
  option (gogoproto.equal) = true;

  uint32 label_id = 1;
  string label_name = 2;
  string value = 3 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
}

message WorkerInference {
  option (gogoproto.equal) = true;

  string worker = 1;
  repeated LabeledValue values = 2;
}

message NetworkInferenceBundle {
  option (gogoproto.equal) = true;

  uint64 topic_id = 1;
  int64 block_height = 2;

  // combined inference I_i
  repeated LabeledValue combined_value = 3;

  // per-inferer inferences
  repeated WorkerInference inferer_values = 4;

  // forecast-implied inferences per forecaster
  repeated WorkerInference forecaster_values = 5;

  // naive baseline
  repeated LabeledValue naive_value = 6;

  // one-out / one-in network inferences
  repeated OneOutInfererValue one_out_inferer_values = 7;
  repeated OneOutForecasterValue one_out_forecaster_values = 8;
  repeated OneInForecasterValue one_in_forecaster_values = 9;
  repeated OneOutInfererForecasterValue one_out_inferer_forecaster_values = 10;
}

message OneOutInfererValue {
  option (gogoproto.equal) = true;

  string withheld_inferer = 1;
  // I_i^{−j}
  repeated LabeledValue combined_inference = 2;
}

message OneOutForecasterValue {
  option (gogoproto.equal) = true;

  string withheld_forecaster = 1;
  // I_i^{−k}
  repeated LabeledValue combined_inference = 2;
}

message OneInForecasterValue {
  option (gogoproto.equal) = true;

  string forecaster = 1;
  // I_i^{+k}
  repeated LabeledValue combined_inference = 2;
}

message OneOutInfererForecasterValue {
  option (gogoproto.equal) = true;

  string forecaster = 1;
  string withheld_inferer = 2;
  // I_i^{−j, evaluated from k}
  repeated LabeledValue combined_inference = 3;
}
