message EventValueBundle {
  option (gogoproto.equal) = true;

  bytes extra_data = 1;
  string combined_value = 2 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  string naive_value = 3 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];

  repeated string inferer_addresses = 4;
  repeated string forecaster_addresses = 5;

  repeated string inferer_values = 6 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  repeated string forecaster_values = 7 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  repeated string one_out_inferer_values = 8 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  repeated string one_out_forecaster_values = 9 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  repeated string one_in_forecaster_values = 10 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.Dec",
    (gogoproto.nullable) = false
  ];
  repeated string one_out_inferer_forecaster_values = 11 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecArray",
    (gogoproto.nullable) = false
  ];
}

message EventNetworkInferenceBundle {
  option (gogoproto.equal) = true;

  uint64 topic_id = 1;
  int64 nonce = 2;

  // The epoch's frozen label registry, in compact-id order: the labels of
  // EventEpochLabelRegistryFrozen for the same topic and nonce.
  repeated string label_names = 3;

  repeated string inferer_addresses = 4;
  repeated string forecaster_addresses = 5;

  string combined_value = 6 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecArray",
    (gogoproto.nullable) = false
  ];

  string naive_value = 7 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecArray",
    (gogoproto.nullable) = false
  ];

  string inferer_values = 8 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecMatrix",
    (gogoproto.nullable) = false
  ]; // (#inferers × L)

  string forecaster_values = 9 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecMatrix",
    (gogoproto.nullable) = false
  ]; // (#forecasters × L)

  string one_out_inferer_values = 10 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecMatrix",
    (gogoproto.nullable) = false
  ]; // (#inferers × L)

  string one_out_forecaster_values = 11 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecMatrix",
    (gogoproto.nullable) = false
  ]; // (#forecasters × L)

  string one_in_forecaster_values = 12 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecMatrix",
    (gogoproto.nullable) = false
  ]; // (#forecasters × L)

  repeated string one_out_inferer_forecaster_values = 13 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.DecMatrix",
    (gogoproto.nullable) = false
  ]; // (#forecasters × #inferers × L)

  bool outlier_resistant = 14;
}

