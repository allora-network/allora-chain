syntax = "proto3";
package emissions.v9;

import "emissions/v3/nonce.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/allora-network/allora-chain/x/emissions/types";

message BoundedInference {
  option (gogoproto.equal) = true;

  uint64 topic_id = 1;
  int64 block_height = 2;
  string inferer = 3;
  string value = 4 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.BoundedExp40Dec",
    (gogoproto.nullable) = false
  ];
  bytes extra_data = 5;
  string proof = 6;
}

message BoundedInferences {
  repeated BoundedInference inferences = 1;
}

message BoundedForecastElement {
  option (gogoproto.equal) = true;

  string inferer = 1;
  string value = 2 [
    (gogoproto.customtype) = "github.com/allora-network/allora-chain/math.BoundedExp40Dec",
    (gogoproto.nullable) = false
  ];
}

message BoundedForecast {
  option (gogoproto.equal) = true;
  uint64 topic_id = 1;
  int64 block_height = 2;
  string forecaster = 3;
  repeated BoundedForecastElement forecast_elements = 4;
  bytes extra_data = 5;
}

message BoundedForecasts {
  repeated BoundedForecast forecasts = 1;
}

message BoundedInferenceForecastBundle {
  option (gogoproto.equal) = true;
  BoundedInference inference = 1;
  BoundedForecast forecast = 2;
}

message BoundedWorkerDataBundle {
  option (gogoproto.equal) = true;
  string worker = 1;
  emissions.v3.Nonce nonce = 2;
  uint64 topic_id = 3;
  BoundedInferenceForecastBundle inference_forecasts_bundle = 4;
  bytes inferences_forecasts_bundle_signature = 5;
  string pubkey = 6;
}

message BoundedWorkerDataBundles {
  repeated BoundedWorkerDataBundle worker_data_bundles = 1;
}
